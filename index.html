<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#050403">
  <title>胶片放映机 · FilmAlbum</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Cpath d='M38 28v44l36-22z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="theater">
    <!-- 双缓冲视频层：始终只有一个显示，另一个用作预缓存无缝切换 -->
    <!-- 防劫持：playsinline 系 + X5 同层渲染 + 隐藏控件/PiP（视频自带音轨，不静音） -->
    <video id="videoA" class="film active"
           playsinline
           webkit-playsinline="true"
           x5-playsinline="true"
           x5-video-player-type="h5-page"
           x5-video-player-fullscreen="false"
           controlslist="nodownload nofullscreen noremoteplayback"
           disablepictureinpicture
           preload="auto"></video>
    <video id="videoB" class="film"
           playsinline
           webkit-playsinline="true"
           x5-playsinline="true"
           x5-video-player-type="h5-page"
           x5-video-player-fullscreen="false"
           controlslist="nodownload nofullscreen noremoteplayback"
           disablepictureinpicture
           preload="auto"></video>

    <!-- 入场遮罩：极简电影海报质感 -->
    <div id="startOverlay">
      <div class="intro">
        <h1 class="title">胶片放映机</h1>

        <button id="startBtn" type="button">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <span class="btn-text">开始放映</span>
        </button>
      </div>

      <p class="hint">
        <span class="hint-label">桌面</span><kbd>点击</kbd><kbd>←</kbd><kbd>→</kbd><kbd>空格</kbd>
        <span class="dot">·</span>
        <span class="hint-label">移动端</span><kbd>底部按钮</kbd><kbd>左右滑动</kbd>
      </p>
    </div>

    <!-- 投影灯点亮光晕 -->
    <div id="lampGlow" aria-hidden="true"></div>

  </main>
  <!-- 底部专用控制区：独立于视频区域，浏览器劫持视频时按钮仍可操作 -->
    <div id="controls" class="controls hidden">
      <div class="control-capsule">
        <!-- 上一个 -->
        <button id="btnPrev" type="button" class="ctl-btn nav" aria-label="上一个" title="上一个 (←)">
          <svg viewBox="0 0 24 24" class="icon"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
        </button>

        <span class="ctl-divider"></span>

        <!-- 背景音开关 -->
        <button id="btnBgm" type="button" class="ctl-btn audio" aria-label="切换背景音" title="静音/播放 (M)">
          <svg viewBox="0 0 24 24" class="icon icon-sound"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
          <svg viewBox="0 0 24 24" class="icon icon-mute"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
        </button>

        <span class="ctl-divider"></span>

        <!-- 下一个 -->
        <button id="btnNext" type="button" class="ctl-btn nav" aria-label="下一个" title="下一个 (→)">
          <svg viewBox="0 0 24 24" class="icon"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
        </button>
      </div>
    </div>


  <noscript>
    <div class="noscript-tip">
      <p>本页「胶片放映机」需要 JavaScript 才能正常播放与切换影片。</p>
      <p>请前往浏览器设置中启用 JavaScript 后重新加载页面。</p>
    </div>
  </noscript>

  <audio id="bgm" src="shucai/maybe.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
