<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <title>胶片放映机 · FilmAlbum</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%23000'/%3E%3Cpath d='M38 28v44l36-22z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main id="theater">
    <!-- 双缓冲视频层：始终只有一个显示，另一个用作预缓存无缝切换 -->
    <!-- 防劫持：playsinline 系 + X5 同层渲染 + 隐藏控件/PiP（视频自带音轨，不静音） -->
    <video id="videoA" class="film active"
           playsinline
           webkit-playsinline="true"
           x5-playsinline="true"
           x5-video-player-type="h5-page"
           x5-video-player-fullscreen="false"
           controlsList="nodownload nofullscreen noremoteplayback"
           disablepictureinpicture
           preload="auto"></video>
    <video id="videoB" class="film"
           playsinline
           webkit-playsinline="true"
           x5-playsinline="true"
           x5-video-player-type="h5-page"
           x5-video-player-fullscreen="false"
           controlsList="nodownload nofullscreen noremoteplayback"
           disablepictureinpicture
           preload="auto"></video>

    <!-- 入场遮罩：极简电影海报质感 -->
    <div id="startOverlay">
      <div class="intro">
        <p class="eyebrow">Film Album · 私人放映</p>
        <h1 class="title">胶片放映机</h1>

        <button id="startBtn" type="button">
          <svg class="btn-icon-svg" viewBox="0 0 24 24" aria-hidden="true">
            <polygon points="9,6.5 9,17.5 18,12" fill="currentColor"/>
          </svg>
          <span class="btn-text">开始放映</span>
        </button>

        <p id="noMaterialTip" class="no-material-tip" hidden>
          未检测到影片素材 · 请将视频放入 shucai/spN/ 后刷新
        </p>
      </div>

      <p class="hint">
        <span class="hint-label">桌面</span><kbd>点击</kbd><kbd>←</kbd><kbd>→</kbd><kbd>空格</kbd>
        <span class="dot">·</span>
        <span class="hint-label">移动端</span><kbd>底部按钮</kbd><kbd>左右滑动</kbd>
      </p>
    </div>

    <!-- 胶片边缘码：当前放映的素材编号 -->
    <div id="reelCode" class="reel-code" aria-hidden="true">
      <span class="rc-label">Reel</span>
      <span id="rcNum" class="rc-num">--</span>
      <span id="rcTotal" class="rc-total">/ --</span>
    </div>

    <!-- 全部素材失效兜底提示 -->
    <p id="allDeadTip" class="dead-tip" hidden>影片素材已全部失效 · 请检查 shucai/ 目录后刷新</p>

  </main>
  <!-- 底部专用控制区：独立于视频区域，浏览器劫持视频时按钮仍可操作 -->
  <div id="controls" class="controls hidden">
    <div class="control-capsule">
      <!-- 上一个 -->
      <button id="btnPrev" type="button" class="ctl-btn nav" aria-label="上一个" title="上一个 (←)">
        <svg viewBox="0 0 24 24" class="icon"><polyline points="14,6.5 8.5,12 14,17.5"/></svg>
      </button>

      <span class="ctl-divider"></span>

      <!-- 背景音开关 -->
      <button id="btnBgm" type="button" class="ctl-btn audio" aria-label="切换背景音" aria-pressed="true" title="静音/播放 (M)">
        <svg viewBox="0 0 24 24" class="icon icon-sound">
          <polygon points="11,5.5 6.5,9.5 3.5,9.5 3.5,14.5 6.5,14.5 11,18.5"/>
          <path class="wave" d="M15 9a4.2 4.2 0 0 1 0 6"/>
          <path class="wave wave-outer" d="M17.5 7a7.5 7.5 0 0 1 0 10"/>
        </svg>
        <svg viewBox="0 0 24 24" class="icon icon-mute">
          <polygon points="11,5.5 6.5,9.5 3.5,9.5 3.5,14.5 6.5,14.5 11,18.5"/>
          <line x1="15.5" y1="9.5" x2="20.5" y2="14.5"/>
          <line x1="20.5" y1="9.5" x2="15.5" y2="14.5"/>
        </svg>
      </button>

      <span class="ctl-divider"></span>

      <!-- 下一个 -->
      <button id="btnNext" type="button" class="ctl-btn nav" aria-label="下一个" title="下一个 (→)">
        <svg viewBox="0 0 24 24" class="icon"><polyline points="10,6.5 15.5,12 10,17.5"/></svg>
      </button>
    </div>
  </div>

  <noscript>
    <div class="noscript-tip">
      <p>本页「胶片放映机」需要 JavaScript 才能正常播放与切换影片。</p>
      <p>请前往浏览器设置中启用 JavaScript 后重新加载页面。</p>
    </div>
  </noscript>

  <audio id="bgm" src="shucai/bgm.mp3" loop preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
